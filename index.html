:root{

  --card:42 55% 98%; --muted:40 26% 90%; --muted-foreground:33 9% 40%;
  --primary:174 72% 25%; --primary-foreground:45 45% 97%;
  --accent:40 42% 87%; --destructive:6 68% 45%;
  --border:40 22% 82%; --input:40 22% 82%; --ring:174 72% 30%;
  --far:26 84% 45%; --far-soft:32 80% 92%; --far-border:30 70% 82%;
  --dot:#e8e3d9; --scroll:#d2cbbc;
  --badge-bg-l:92%; --badge-bg-s:60%; --badge-fg-l:30%; --badge-fg-s:55%;
  --like:150 55% 32%; --like-soft:150 45% 93%;
}
html[data-theme="dark"]{
  --background:28 10% 9%; --foreground:42 22% 92%;
  --card:28 9% 13%; --muted:28 8% 18%; --muted-foreground:36 9% 64%;
  --primary:174 55% 45%; --primary-foreground:180 30% 8%;
  --accent:28 10% 20%; --destructive:6 72% 62%;
  --border:28 8% 24%; --input:28 8% 24%; --ring:174 55% 50%;
  --far:30 85% 62%; --far-soft:28 25% 17%; --far-border:30 35% 30%;
  --dot:#211f1c; --scroll:#413c35;
  --badge-bg-l:20%; --badge-bg-s:38%; --badge-fg-l:76%; --badge-fg-s:65%;
  --like:150 45% 55%; --like-soft:150 30% 16%;
}
@media (prefers-color-scheme:dark){
  html[data-theme="auto"]{
    --background:28 10% 9%; --foreground:42 22% 92%;
    --card:28 9% 13%; --muted:28 8% 18%; --muted-foreground:36 9% 64%;
    --primary:174 55% 45%; --primary-foreground:180 30% 8%;
    --accent:28 10% 20%; --destructive:6 72% 62%;
    --border:28 8% 24%; --input:28 8% 24%; --ring:174 55% 50%;
    --far:30 85% 62%; --far-soft:28 25% 17%; --far-border:30 35% 30%;
    --dot:#211f1c; --scroll:#413c35;
    --badge-bg-l:20%; --badge-bg-s:38%; --badge-fg-l:76%; --badge-fg-s:65%;
    --like:150 45% 55%; --like-soft:150 30% 16%;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; line-height:1.5;
  background-color:hsl(var(--background)); color:hsl(var(--foreground));
  -webkit-font-smoothing:antialiased;
  background-image:radial-gradient(var(--dot) .5px,transparent .5px);
  background-size:22px 22px;
  font-family:Sora,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:14px;
}
h1,h2,h3,h4{margin:0;font-weight:inherit;font-size:inherit}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.display{font-family:Sora,ui-sans-serif,system-ui,sans-serif;letter-spacing:-.02em}
#root{max-width:896px;margin:0 auto;padding:28px 18px 40px}
@media(min-width:640px){#root{padding:40px 32px}}

/* header */
.eyebrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.14em;color:hsl(var(--primary));margin-bottom:6px}
.h1{font-size:32px;font-weight:700;line-height:1.15}
@media(min-width:640px){.h1{font-size:38px}}
.sub{margin-top:8px;font-size:13.5px;color:hsl(var(--muted-foreground))}
.rule{margin-top:20px;height:1px;width:100%;background:linear-gradient(90deg,hsl(var(--border)),hsl(var(--border)),transparent)}
.head-row{display:flex;flex-direction:column-reverse;align-items:stretch;gap:14px}
.head-tools{display:flex;gap:6px;flex-shrink:0;justify-content:flex-end}
@media(min-width:640px){
  .head-row{flex-direction:row;align-items:flex-start;justify-content:space-between;gap:12px}
  .head-tools{padding-top:4px}
}
.icon-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 10px;border:1px solid hsl(var(--border));border-radius:10px;background:hsl(var(--card));font-size:12.5px;color:hsl(var(--muted-foreground));transition:border-color .15s,color .15s}
.icon-btn:hover{border-color:hsl(var(--primary)/.5);color:hsl(var(--foreground))}

/* banners */
.banner{display:flex;align-items:flex-start;gap:10px;margin-bottom:18px;padding:12px 14px;border-radius:14px;border:1px solid hsl(var(--far-border));background:hsl(var(--far-soft));color:hsl(var(--far));font-size:13px}
.alarm{margin-bottom:24px;padding:16px;border-radius:16px;border:1px solid hsl(var(--destructive)/.3);background:hsl(var(--destructive)/.06)}
.alarm-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;color:hsl(var(--destructive));font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.alarm-row{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 12px;padding:2px 0}
.alarm-name{font-size:13.5px;font-weight:500}
.alarm-chip{display:inline-flex;align-items:center;gap:4px;border:1px solid hsl(var(--destructive)/.4);border-radius:999px;padding:1px 8px;font-size:11px;color:hsl(var(--destructive));white-space:nowrap}
.alarm-chip.soon{background:hsl(var(--destructive)/.15);font-weight:600}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:20px;padding:4px;border:1px solid hsl(var(--border));border-radius:14px;background:hsl(var(--muted)/.5)}
@media(min-width:640px){.tabs{display:inline-flex}}
.tab{flex:1;white-space:nowrap;border-radius:10px;padding:7px 12px;font-size:12.5px;font-weight:500;color:hsl(var(--muted-foreground));transition:background .15s,color .15s}
@media(min-width:640px){.tab{flex:none;padding:6px 16px;font-size:13px}}
.tab:hover{color:hsl(var(--foreground))}
.tab[aria-selected="true"]{background:hsl(var(--primary));color:hsl(var(--primary-foreground));box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* sections */
.section{margin-bottom:32px}
.sec-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:12px;margin-bottom:12px}
.we-badge{border-radius:8px;background:hsl(var(--primary));color:hsl(var(--primary-foreground));padding:4px 10px;font-size:12px;font-weight:600;letter-spacing:.03em}
.we-range{font-size:18px;font-weight:600}
.sec-spacer{flex:1}
.sub-head{margin:4px 0 10px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:hsl(var(--muted-foreground))}
.grid{display:grid;gap:12px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.empty{font-size:13px;font-style:italic;color:hsl(var(--muted-foreground))}
.far-box{margin-top:16px;padding:14px;border-radius:16px;border:1px solid hsl(var(--far-border));background:hsl(var(--far-soft)/.6)}
.far-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:hsl(var(--far));font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.more-btn{margin-top:10px;font-size:12.5px;font-weight:500;color:hsl(var(--primary))}
.more-btn:hover{text-decoration:underline}

/* card */
.card{position:relative;border-radius:16px;border:1px solid hsl(var(--border));background:hsl(var(--card));padding:16px;box-shadow:0 1px 2px rgba(0,0,0,.04);transition:border-color .15s,opacity .15s}
.card:hover{border-color:hsl(var(--primary)/.4)}
.card.far{border-color:hsl(var(--far-border));background:hsl(var(--far-soft))}
.card.liked{border-color:hsl(var(--like)/.55);background:hsl(var(--like-soft))}
.card.disliked{opacity:.5}
.card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-title{font-family:Sora,sans-serif;font-size:15px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.card-chips{display:flex;flex-shrink:0;flex-wrap:wrap;align-items:center;justify-content:flex-end;gap:6px}
.meta-row{display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px;margin-top:6px;font-size:12.5px;color:hsl(var(--muted-foreground))}
.meta-row span{display:inline-flex;align-items:center;gap:4px}
.desc{margin-top:8px;font-size:13px;line-height:1.6;color:hsl(var(--foreground)/.72)}
.card-foot{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:12px}
.foot-l,.foot-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cost{font-size:12px;font-weight:500;color:hsl(var(--foreground)/.75)}
.link{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:500;color:hsl(var(--primary))}
.link:hover{text-decoration:underline}
.mini{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 8px;border:1px solid hsl(var(--border));border-radius:999px;font-size:11.5px;color:hsl(var(--muted-foreground));background:hsl(var(--card))}
.mini:hover{border-color:hsl(var(--primary)/.5);color:hsl(var(--foreground))}
.mini.on-up{border-color:hsl(var(--like)/.6);color:hsl(var(--like));background:hsl(var(--like-soft))}
.mini.on-down{border-color:hsl(var(--destructive)/.5);color:hsl(var(--destructive));background:hsl(var(--destructive)/.08)}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 8px;font-size:11px;font-weight:500}
.pill-cat{background:hsl(var(--cat-h,30) var(--badge-bg-s) var(--badge-bg-l));color:hsl(var(--cat-h,30) var(--badge-fg-s) var(--badge-fg-l))}
.pill-out{border:1px solid hsl(var(--border));color:hsl(var(--muted-foreground));font-weight:400}
.pill-out.far{border-color:hsl(var(--far)/.45);color:hsl(var(--far))}
.pill-run{background:hsl(150 var(--badge-bg-s) var(--badge-bg-l));color:hsl(150 var(--badge-fg-s) var(--badge-fg-l))}
.pill-age{background:hsl(40 var(--badge-bg-s) var(--badge-bg-l));color:hsl(40 var(--badge-fg-s) var(--badge-fg-l))}
.stars{display:inline-flex;gap:1px;align-items:center}
.stars svg{width:12px;height:12px;display:block}
.star-on svg{fill:hsl(42 90% 55%);color:hsl(42 90% 55%)}
.star-off svg{fill:none;color:hsl(var(--muted-foreground)/.45)}

/* table */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.search-wrap{position:relative;flex:1;min-width:200px}
.search-wrap svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:hsl(var(--muted-foreground))}
input[type=search],select{height:36px;border:1px solid hsl(var(--input));border-radius:10px;background:hsl(var(--card));color:hsl(var(--foreground));font-size:13px;padding:0 12px;font-family:inherit}
input[type=search]{width:100%;padding-left:34px}
input:focus,select:focus{outline:2px solid hsl(var(--ring)/.4);outline-offset:0}
.table-wrap{overflow-x:auto;border:1px solid hsl(var(--border));border-radius:16px;background:hsl(var(--card))}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:10px 12px;font-weight:600;color:hsl(var(--muted-foreground));background:hsl(var(--muted)/.5);border-bottom:1px solid hsl(var(--border));white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid hsl(var(--border));vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:hsl(var(--accent)/.4)}
.t-muted{color:hsl(var(--muted-foreground))}
.count{margin-top:8px;font-size:12px;color:hsl(var(--muted-foreground))}
.thin-scroll::-webkit-scrollbar{width:8px;height:8px}
.thin-scroll::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:8px}

/* holiday */
.holiday-box{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:16px;border-radius:16px;border:1px solid hsl(40 60% 75%);background:hsl(45 70% 92%);color:hsl(35 45% 22%)}
html[data-theme="dark"] .holiday-box{border-color:hsl(40 30% 30%);background:hsl(40 25% 16%);color:hsl(45 60% 82%)}
@media(prefers-color-scheme:dark){html[data-theme="auto"] .holiday-box{border-color:hsl(40 30% 30%);background:hsl(40 25% 16%);color:hsl(45 60% 82%)}}
.holiday-box .hb-t{font-size:16px;font-weight:600}
.holiday-box .hb-s{font-size:13px;opacity:.85}
.neutral-box{display:flex;align-items:center;gap:12px;margin-bottom:24px;padding:16px;border-radius:16px;border:1px solid hsl(var(--border));background:hsl(var(--muted)/.4)}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(20,16,12,.55);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto;z-index:50}
.modal{width:100%;max-width:560px;background:hsl(var(--card));border:1px solid hsl(var(--border));border-radius:18px;padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.modal h3{font-size:17px;font-weight:600;font-family:Sora,sans-serif}
.modal p{font-size:13px;color:hsl(var(--muted-foreground));margin-top:6px}
.modal textarea{width:100%;margin-top:12px;min-height:150px;border:1px solid hsl(var(--input));border-radius:12px;background:hsl(var(--background));color:hsl(var(--foreground));font-family:ui-monospace,Menlo,monospace;font-size:12px;padding:10px;resize:vertical}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;justify-content:flex-end}
.btn{height:34px;padding:0 14px;border-radius:10px;border:1px solid hsl(var(--border));font-size:13px;font-weight:500;background:hsl(var(--card))}
.btn:hover{border-color:hsl(var(--primary)/.5)}
.btn-primary{background:hsl(var(--primary));color:hsl(var(--primary-foreground));border-color:transparent}
.fb-list{margin-top:12px;font-size:13px}
.fb-item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dashed hsl(var(--border))}
footer{margin-top:40px;border-top:1px solid hsl(var(--border));padding-top:16px;font-size:11.5px;color:hsl(var(--muted-foreground))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>

<script>
(function(){
"use strict";
var DB = (window.DASHBOARD_DB && Array.isArray(window.DASHBOARD_DB.events)) ? window.DASHBOARD_DB : {meta:{},events:[]};
var META = DB.meta || {};
var FAR = META.farAwayDistanceThresholdKm || 40;
var ONGOING_MIN_DAYS = 5; /* Zeitraum >= 5 Tage = Dauerangebot */

/* ---------- storage ---------- */
function ls(k, fallback){ try{ var v = localStorage.getItem(k); return v===null?fallback:JSON.parse(v); }catch(e){ return fallback; } }
function lsSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var state = {
  tab: ls('fa.tab','weekends'),
  theme: ls('fa.theme','auto'),
  feedback: ls('fa.feedback',{}),
  showHidden: ls('fa.showHidden',false),
  q: ls('fa.q',''),
  cat: ls('fa.cat','all'),
  hor: ls('fa.hor','all'),
  expanded: {},
  modal: null
};
document.documentElement.setAttribute('data-theme', state.theme);

/* ---------- dates ---------- */
function sod(d){ var x = new Date(d); x.setHours(0,0,0,0); return x; }
var TODAY = sod(new Date());
function pd(s){ if(!s) return null; var p = String(s).slice(0,10).split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function fmt(s){ var d = (s instanceof Date)? s : pd(s); if(!d) return '—';
  return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtShort(d){ return d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'}).replace(/\.$/,''); }
function wd(d){ return ['So','Mo','Di','Mi','Do','Fr','Sa'][d.getDay()]; }
function daysUntil(s){ var d = pd(s); return d===null? Infinity : Math.round((d-TODAY)/864e5); }
function startOf(e){ return pd(e.date); }
function endOf(e){ return pd(e.dateEnd) || pd(e.date); }
function spanDays(e){ var s=startOf(e), t=endOf(e); if(!s) return null; return Math.round((t-s)/864e5)+1; }
function isOngoing(e){ if(!e.date) return true; var n=spanDays(e); return n!==null && n>=ONGOING_MIN_DAYS; }
function isPast(e){ var t = endOf(e); return t ? t < TODAY : false; }
function overlaps(e,a,b){ var s=startOf(e), t=endOf(e); if(!s) return false; return s<=b && t>=a; }

/* ---------- events ---------- */
var EVENTS = DB.events.filter(function(e){ return !isPast(e) && e.status!=='cancelled'; });
var PAST_COUNT = DB.events.length - EVENTS.length;

function fb(e){ return state.feedback[e.id] || 0; }
function score(e){ return (e.familyScore||0) + fb(e)*3; }
function byScore(a,b){ var d = score(b)-score(a); if(d) return d;
  return (a.date||'9999') < (b.date||'9999') ? -1 : 1; }
function byDate(a,b){ return (a.date||'9999') < (b.date||'9999') ? -1 : 1; }
function visible(list){ return state.showHidden ? list : list.filter(function(e){ return fb(e)>=0; }); }

function weekends(n){
  var out=[], dow=TODAY.getDay(), off;
  if(dow===0) off=-2; else if(dow===6) off=-1; else off=5-dow;
  var fri0 = new Date(TODAY); fri0.setDate(TODAY.getDate()+off);
  for(var i=0;i<n;i++){
    var f = new Date(fri0); f.setDate(fri0.getDate()+7*i);
    var s = new Date(f); s.setDate(f.getDate()+2);
    out.push({index:i, fri:f, sun:s});
  }
  return out;
}

/* ---------- icons ---------- */
function svg(path, extra){
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" '+(extra||'')+'>'+path+'</svg>';
}
var IC = {
  pin: svg('<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>','width="14" height="14"'),
  cal: svg('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>','width="14" height="14"'),
  ext: svg('<path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>','width="14" height="14"'),
  alert: svg('<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>','width="16" height="16"'),
  clock: svg('<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>','width="12" height="12"'),
  sparkle: svg('<path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/>','width="16" height="16"'),
  compass: svg('<circle cx="12" cy="12" r="10"/><path d="m16 8-2 6-6 2 2-6Z"/>','width="16" height="16"'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>','width="15" height="15"'),
  moon: svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>','width="15" height="15"'),
  auto: svg('<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18Z" fill="currentColor" stroke="none"/>','width="15" height="15"'),
  search: svg('<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',''),
  down: svg('<path d="M12 3v12"/><path d="m7 12 5 5 5-5"/><path d="M4 21h16"/>','width="13" height="13"'),
  up: svg('<path d="M7 10v10H4V10Z"/><path d="M7 10 11 3a2 2 0 0 1 3 1v4h4.5a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 17 19H7"/>','width="13" height="13"'),
  dn: svg('<path d="M17 14V4h3v10Z"/><path d="M17 14 13 21a2 2 0 0 1-3-1v-4H5.5a2 2 0 0 1-2-2.4l1.4-7A2 2 0 0 1 7 5h10"/>','width="13" height="13"'),
  chat: svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2Z"/>','width="15" height="15"'),
  star: '<svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9Z"/></svg>',
  sunhat: svg('<path d="M3 18h18"/><path d="M7 18a5 5 0 0 1 10 0"/><circle cx="12" cy="8" r="3"/>','width="20" height="20"'),
  infinity: svg('<path d="M6 12c0-2 1.5-3.5 3.5-3.5S12 10 12 12s1.5 3.5 3.5 3.5S19 14 19 12s-1.5-3.5-3.5-3.5S12 10 12 12s-1.5 3.5-3.5 3.5S6 14 6 12Z"/>','width="16" height="16"')
};

/* ---------- category colors (hue) ---------- */
var HUE = {theater:350, puppentheater:350, museum:205, zoo:150, aquarium:190, kino:265,
  kirmes:38, festival:300, familienfest:38, familienfestival:38, freizeitpark:300,
  museumsbahn:25, workshop:170, natur:95, sport:95, weihnachtsmarkt:0, markt:170, kinderkonzert:275,
  konzert:275, musik:275, musikschule:275, orchester:275};
function hueFor(c){
  if(!c) return 30;
  var parts = String(c).toLowerCase().trim().split('/');
  for(var i=0;i<parts.length;i++){ if(HUE[parts[i]]!==undefined) return HUE[parts[i]]; }
  return 30;
}

/* ---------- dom helpers ---------- */
function h(tag, attrs){
  var el = document.createElement(tag);
  attrs = attrs||{};
  for(var k in attrs){
    var v = attrs[k];
    if(v===null||v===undefined||v===false) continue;
    if(k==='html') el.innerHTML = v;
    else if(k==='text') el.textContent = v;
    else if(k==='on') for(var ev in v) el.addEventListener(ev, v[ev]);
    else el.setAttribute(k, v);
  }
  for(var i=2;i<arguments.length;i++){
    var c = arguments[i];
    if(c===null||c===undefined||c===false) continue;
    if(Array.isArray(c)) c.forEach(function(x){ if(x) el.appendChild(x); });
    else if(typeof c === 'string') el.appendChild(document.createTextNode(c));
    else el.appendChild(c);
  }
  return el;
}

/* ---------- ICS ---------- */
function pad(n){ return n<10? '0'+n : ''+n; }
function icsDate(d){ return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()); }
function icsEsc(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
function fold(line){
  var out=[], s=line;
  while(s.length>72){ out.push(s.slice(0,72)); s=' '+s.slice(72); }
  out.push(s); return out.join('\r\n');
}
function vevent(e){
  if(!e.date) return null;
  var s = startOf(e), t = endOf(e), L=[];
  L.push('BEGIN:VEVENT');
  L.push('UID:'+e.id+'@familien-dashboard');
  var now = new Date();
  L.push('DTSTAMP:'+now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+'T'
    +pad(now.getUTCHours())+pad(now.getUTCMinutes())+pad(now.getUTCSeconds())+'Z');
  if(e.timeStart && /^\d{1,2}:\d{2}/.test(e.timeStart) && s.getTime()===t.getTime()){
    var hm = e.timeStart.split(':');
    var st = new Date(s); st.setHours(+hm[0], +hm[1], 0, 0);
    var en = new Date(st.getTime() + 2*3600*1000);
    L.push('DTSTART:'+icsDate(st)+'T'+pad(st.getHours())+pad(st.getMinutes())+'00');
    L.push('DTEND:'+icsDate(en)+'T'+pad(en.getHours())+pad(en.getMinutes())+'00');
  } else {
    var end = new Date(t); end.setDate(end.getDate()+1);
    L.push('DTSTART;VALUE=DATE:'+icsDate(s));
    L.push('DTEND;VALUE=DATE:'+icsDate(end));
  }
  L.push(fold('SUMMARY:'+icsEsc(e.name)));
  L.push(fold('LOCATION:'+icsEsc([e.location,e.city].filter(Boolean).join(', '))));
  var desc = [e.description, e.cost?('Kosten: '+e.cost):'', e.dateNote?('Hinweis: '+e.dateNote):'', e.link||''].filter(Boolean).join('\n');
  L.push(fold('DESCRIPTION:'+icsEsc(desc)));
  if(e.link) L.push(fold('URL:'+e.link));
  L.push('END:VEVENT');
  return L.join('\r\n');
}
function downloadIcs(list, filename){
  var body = list.map(vevent).filter(Boolean);
  if(!body.length) return;
  var ics = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Familien-Dashboard Ruhrgebiet//DE','CALSCALE:GREGORIAN']
    .concat(body).concat(['END:VCALENDAR']).join('\r\n');
  try{
    var blob = new Blob([ics], {type:'text/calendar;charset=utf-8'});
    var url = URL.createObjectURL(blob);
    var a = h('a',{href:url, download:filename});
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }catch(err){
    state.modal = {type:'ics', text:ics};
    render();
  }
}

/* ---------- components ---------- */
function stars(n){
  if(!n) return null;
  var w = h('span',{class:'stars', title:'Familien-Score '+n+'/5'});
  for(var i=0;i<5;i++) w.appendChild(h('span',{class: i<n?'star-on':'star-off', html:IC.star}));
  return w;
}
function catPill(c){
  if(!c) return null;
  return h('span',{class:'pill pill-cat', style:'--cat-h:'+hueFor(c), text:c});
}
function dateLabel(e){
  if(!e.date) return e.dateNote || 'laufendes Angebot';
  var s = startOf(e), t = endOf(e);
  if(t > s) return fmtShort(s)+'.–'+fmt(t);
  return wd(s)+', '+fmt(s) + (e.timeStart? ', '+e.timeStart+' Uhr' : '');
}
function dateCell(e){
  if(!e.date) return e.dateNote? 'offen' : '—';
  var s = startOf(e), t = endOf(e);
  return t>s ? fmtShort(s)+'.–'+fmtShort(t)+'.' : fmt(s);
}
function card(e, tone){
  var f = fb(e);
  var cls = 'card' + (tone==='far'?' far':'') + (f>0?' liked':'') + (f<0?' disliked':'');
  var chips = [];
  if(e.ageNote) chips.push(h('span',{class:'pill pill-age', text:e.ageNote}));
  if(e.distanceKm!==null && e.distanceKm!==undefined)
    chips.push(h('span',{class:'pill pill-out'+(tone==='far'?' far':''),
      html:IC.pin+' '+(e.distanceKm===0? 'vor Ort' : e.distanceKm+' km')}));
  if(isOngoing(e)) chips.push(h('span',{class:'pill pill-run', text: e.dateEnd? ('läuft bis '+fmtShort(endOf(e))+'.') : 'laufend'}));

  var foot_r = [];
  if(e.cost) foot_r.push(h('span',{class:'cost', text:e.cost}));
  if(e.date) foot_r.push(h('button',{class:'mini', title:'Als Kalendereintrag (.ics) sichern',
    on:{click:function(){ downloadIcs([e], e.id+'.ics'); }}}, h('span',{html:IC.down}), 'Kalender'));
  if(e.link) foot_r.push(h('a',{class:'link', href:e.link, target:'_blank', rel:'noopener noreferrer'},
    'Details ', h('span',{html:IC.ext})));

  return h('div',{class:cls},
    h('div',{class:'card-top'},
      h('h4',{class:'card-title', text:e.name}),
      h('div',{class:'card-chips'}, chips)
    ),
    h('div',{class:'meta-row'},
      (e.location||e.city) ? h('span',{html:IC.pin+' '+escapeHtml([e.location,e.city].filter(Boolean).join(' · '))}) : null,
      h('span',{html:IC.cal+' '+escapeHtml(dateLabel(e))})
    ),
    e.description ? h('p',{class:'desc', text:e.description}) : null,
    h('div',{class:'card-foot'},
      h('div',{class:'foot-l'},
        catPill(e.category), stars(e.familyScore),
        h('button',{class:'mini'+(f>0?' on-up':''), title:'Gefällt uns', 'aria-pressed':f>0?'true':'false',
          on:{click:function(){ setFb(e.id, f>0?0:1); }}}, h('span',{html:IC.up})),
        h('button',{class:'mini'+(f<0?' on-down':''), title:'Eher nichts für uns', 'aria-pressed':f<0?'true':'false',
          on:{click:function(){ setFb(e.id, f<0?0:-1); }}}, h('span',{html:IC.dn}))
      ),
      h('div',{class:'foot-r'}, foot_r)
    )
  );
}
function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function setFb(id, val){
  if(val===0) delete state.feedback[id]; else state.feedback[id]=val;
  lsSet('fa.feedback', state.feedback);
  render();
}

function grid(list, tone){
  var g = h('div',{class:'grid'});
  list.forEach(function(e){ g.appendChild(card(e, tone)); });
  return g;
}
function farBox(list, key){
  if(!list.length) return null;
  var open = !!state.expanded[key];
  var shown = open ? list : list.slice(0,3);
  var box = h('div',{class:'far-box'},
    h('div',{class:'far-h', html:IC.compass+' <span>Weiter weg, aber besonders · &gt;'+FAR+' km</span>'}),
    grid(shown,'far')
  );
  if(list.length>3) box.appendChild(h('button',{class:'more-btn',
    text: open ? '– weniger anzeigen' : '+ alle '+list.length+' anzeigen',
    on:{click:function(){ state.expanded[key]=!open; render(); }}}));
  return box;
}

/* ---------- views ---------- */
function ticketAlarm(){
  var list = EVENTS.filter(function(e){ var d=daysUntil(e.ticketDeadline); return e.ticketDeadline && d>=0 && d<=21; })
    .sort(function(a,b){ return daysUntil(a.ticketDeadline)-daysUntil(b.ticketDeadline); });
  if(!list.length) return null;
  var box = h('div',{class:'alarm'},
    h('div',{class:'alarm-h', html:IC.alert+' <span>Ticket-Alarm · Fristen in den nächsten 3 Wochen</span>'}));
  list.forEach(function(e){
    var d = daysUntil(e.ticketDeadline);
    var label = d===0? 'Frist heute' : (d===1? 'Frist morgen' : 'Frist '+fmt(e.ticketDeadline)+' · in '+d+' Tagen');
    box.appendChild(h('div',{class:'alarm-row'},
      h('span',{class:'alarm-name'}, e.name,
        e.link? h('a',{href:e.link, target:'_blank', rel:'noopener noreferrer', style:'margin-left:8px;color:hsl(var(--primary))', text:'↗'}) : null),
      h('span',{class:'alarm-chip'+(d<=7?' soon':''), html:IC.clock+' '+escapeHtml(label)})
    ));
  });
  return box;
}

function weekendView(){
  var wrap = h('div');
  /* bewusst ohne horizon-Filter: ein falsch als "long" markiertes Event
     soll nicht unsichtbar werden, wenn sein Datum im Fenster liegt */
  var dated = visible(EVENTS.filter(function(e){ return e.date && !isOngoing(e); }));
  var wes = weekends(3);
  var lastSun = wes[wes.length-1].sun;
  var ongoing = visible(EVENTS.filter(function(e){
    return isOngoing(e) && (!e.date || startOf(e) <= lastSun);
  }));
  var assigned = {};

  wes.forEach(function(w){
    var inWe = dated.filter(function(e){ return overlaps(e, w.fri, w.sun); });
    inWe.forEach(function(e){ assigned[e.id]=1; });
    var near = inWe.filter(function(e){ return (e.distanceKm||0)<=FAR; }).sort(byScore);
    var far  = inWe.filter(function(e){ return (e.distanceKm||0)>FAR; }).sort(byScore);
    var sec = h('section',{class:'section'},
      h('div',{class:'sec-head'},
        h('span',{class:'we-badge', text:'WE '+(w.index+1)}),
        h('span',{class:'we-range display', text:'Fr '+fmtShort(w.fri)+'. – So '+fmtShort(w.sun)+'.'}),
        h('span',{class:'sec-spacer'}),
        (near.length+far.length) ? h('button',{class:'mini', title:'Alle Termine dieses Wochenendes als .ics',
          on:{click:function(){ downloadIcs(near.concat(far), 'wochenende-'+(w.index+1)+'.ics'); }}},
          h('span',{html:IC.down}), 'Wochenende') : null
      ),
      near.length ? grid(near) : h('p',{class:'empty', text:'Keine festen Termine für dieses Wochenende gefunden – siehe „Läuft gerade" unten.'}),
      farBox(far, 'we'+w.index)
    );
    wrap.appendChild(sec);
  });

  /* Mo–Do im selben Zeitfenster: sonst unsichtbar */
  var weekday = dated.filter(function(e){ return !assigned[e.id] && overlaps(e, TODAY, lastSun); }).sort(byDate);
  if(weekday.length){
    wrap.appendChild(h('section',{class:'section'},
      h('div',{class:'sec-head'},
        h('span',{class:'we-badge', style:'background:hsl(var(--muted));color:hsl(var(--muted-foreground))', text:'MO–DO'}),
        h('span',{class:'we-range display', text:'Unter der Woche'}),
        h('span',{class:'sec-spacer'}),
        h('button',{class:'mini', on:{click:function(){ downloadIcs(weekday,'unter-der-woche.ics'); }}},
          h('span',{html:IC.down}), 'Alle')
      ),
      grid(weekday)
    ));
  }

  /* Dauerangebote – einmal, statt in jedem Wochenende wiederholt */
  var near = ongoing.filter(function(e){ return (e.distanceKm||0)<=FAR; }).sort(byScore);
  var far  = ongoing.filter(function(e){ return (e.distanceKm||0)>FAR; }).sort(byScore);
  if(near.length || far.length){
    var open = state.expanded.ongoing !== false;
    var sec = h('section',{class:'section'},
      h('div',{class:'sec-head'},
        h('span',{class:'we-badge', style:'background:hsl(150 var(--badge-bg-s) var(--badge-bg-l));color:hsl(150 var(--badge-fg-s) var(--badge-fg-l))', html:IC.infinity}),
        h('span',{class:'we-range display', text:'Läuft gerade · jederzeit möglich'}),
        h('span',{class:'sec-spacer'}),
        h('button',{class:'mini', text: open?'einklappen':'ausklappen ('+(near.length+far.length)+')',
          on:{click:function(){ state.expanded.ongoing = !open; render(); }}})
      ));
    if(open){
      sec.appendChild(h('p',{class:'sub-head', text:'Gilt für alle drei Wochenenden – Ausweichideen bei schlechtem Wetter oder leerem Kalender'}));
      sec.appendChild(grid(near));
      var fbx = farBox(far,'ongoingfar'); if(fbx) sec.appendChild(fbx);
    }
    wrap.appendChild(sec);
  }
  return wrap;
}

function currentHoliday(){
  var t = TODAY.getTime();
  var hs = META.holidays||[];
  for(var i=0;i<hs.length;i++){
    if(t >= pd(hs[i].start).getTime() && t <= pd(hs[i].end).getTime()) return hs[i];
  }
  return null;
}
function nextHoliday(){
  var t = TODAY.getTime();
  return (META.holidays||[]).filter(function(x){ return pd(x.start).getTime()>t; })
    .sort(function(a,b){ return pd(a.start)-pd(b.start); })[0] || null;
}
function holidayView(){
  var cur = currentHoliday(), nxt = nextHoliday();
  var pool = visible(EVENTS.filter(function(e){ return e.holidayProgram && (e.distanceKm||0)<=FAR; }));
  if(cur){
    var start = pd(cur.start), end = pd(cur.end);
    var totalWeeks = Math.max(1, Math.ceil((end-start+864e5)/6048e5));
    var weekNo = Math.min(totalWeeks, Math.max(1, Math.floor((TODAY-start)/6048e5)+1));
    var daysLeft = Math.max(0, Math.round((end-TODAY)/864e5));
    var list = pool.filter(function(e){ return !e.holidayName || e.holidayName===cur.name; });
    var fixed = list.filter(function(e){ return e.date && !isOngoing(e); }).sort(byDate);
    var running = list.filter(isOngoing).sort(byScore);
    var v = h('div',{},
      h('div',{class:'holiday-box'}, h('span',{html:IC.sunhat}),
        h('div', h('div',{class:'hb-t display', text: cur.name + (cur.region? ' '+cur.region : '')}),
          h('div',{class:'hb-s', text: fmt(cur.start)+' – '+fmt(cur.end)+' · Woche '+weekNo+' von '+totalWeeks+' · noch '+daysLeft+' Tage'}))));
    if(fixed.length){
      v.appendChild(h('div',{class:'sub-head', text:'Feste Termine'}));
      v.appendChild(grid(fixed));
    }
    if(running.length){
      v.appendChild(h('div',{class:'sub-head', style:'margin-top:24px', text:'Laufende Angebote (ohne festen Termin)'}));
      v.appendChild(grid(running));
    }
    if(!list.length) v.appendChild(h('p',{class:'empty', text:'Aktuell keine Ferienprogramme hinterlegt.'}));
    return v;
  }
  if(nxt){
    var d = daysUntil(nxt.start);
    var list2 = pool.filter(function(e){ return e.holidayName===nxt.name; }).sort(byScore);
    var v2 = h('div',{},
      h('div',{class:'neutral-box'}, h('span',{html:IC.sunhat, style:'color:hsl(var(--primary))'}),
        h('div', h('div',{class:'hb-t display', text:'Nächste Ferien: '+nxt.name+(nxt.region? ' '+nxt.region : '')}),
          h('div',{class:'hb-s t-muted', text:'ab '+fmt(nxt.start)+' · in '+d+' Tagen'}))));
    v2.appendChild(list2.length? grid(list2)
      : h('p',{class:'empty', text:'Sobald die Ferien näher rücken, erscheinen hier passende Programme und Anmeldefristen.'}));
    return v2;
  }
  return h('p',{class:'empty', text:'Keine Ferieninformationen hinterlegt.'});
}

function tableView(){
  var cats = [];
  EVENTS.forEach(function(e){ if(e.category && cats.indexOf(e.category)<0) cats.push(e.category); });
  cats.sort();
  var q = state.q.toLowerCase();
  var rows = visible(EVENTS).filter(function(e){
    return (state.cat==='all' || e.category===state.cat)
      && (state.hor==='all' || e.horizon===state.hor)
      && (!q || (e.name+' '+(e.location||'')+' '+(e.city||'')+' '+(e.description||'')).toLowerCase().indexOf(q)>=0);
  }).sort(byDate);

  var sel = function(val, opts, onch){
    var s = h('select',{on:{change:function(ev){ onch(ev.target.value); }}});
    opts.forEach(function(o){ s.appendChild(h('option',{value:o[0], selected: o[0]===val? 'selected':null, text:o[1]})); });
    s.value = val; return s;
  };
  var search = h('input',{type:'search', value:state.q, placeholder:'Suche nach Name, Ort, Stichwort …',
    on:{input:function(ev){ state.q=ev.target.value; lsSet('fa.q',state.q); renderTableOnly(); }}});

  var tbody = h('tbody');
  rows.forEach(function(e){
    var f = fb(e);
    tbody.appendChild(h('tr',{},
      h('td',{}, h('strong',{style:'font-weight:500', text:e.name}),
        h('span',{class:'t-muted', style:'margin-left:8px;font-size:11px', text: e.horizon==='long'?'langfristig':'kurzfristig'}),
        f>0? h('span',{style:'margin-left:6px;color:hsl(var(--like))', html:IC.up}) : null,
        f<0? h('span',{style:'margin-left:6px;color:hsl(var(--destructive))', html:IC.dn}) : null),
      h('td',{class:'t-muted', text:e.city||e.location||'—'}),
      h('td',{class:'t-muted', style:'white-space:nowrap', text: dateCell(e)}),
      h('td',{}, catPill(e.category)),
      h('td',{class:'t-muted', text:e.ticketStatus||'—'}),
      h('td',{style:'text-align:right;white-space:nowrap'},
        e.date? h('button',{class:'mini', title:'.ics', on:{click:function(){ downloadIcs([e], e.id+'.ics'); }}}, h('span',{html:IC.down})) : null,
        e.link? h('a',{href:e.link, target:'_blank', rel:'noopener noreferrer', style:'margin-left:6px;color:hsl(var(--primary))', html:IC.ext}) : null)
    ));
  });
  if(!rows.length) tbody.appendChild(h('tr',{}, h('td',{colspan:'6', style:'text-align:center;padding:32px;font-style:italic', class:'t-muted', text:'Keine Treffer.'})));

  var thead = h('thead',{}, h('tr',{},
    h('th',{text:'Event'}), h('th',{text:'Ort'}), h('th',{text:'Datum'}),
    h('th',{text:'Kategorie'}), h('th',{text:'Ticket'}), h('th',{})));

  return h('div',{id:'tableview'},
    h('div',{class:'filters'},
      h('div',{class:'search-wrap'}, h('span',{html:IC.search}), search),
      sel(state.cat, [['all','Alle Kategorien']].concat(cats.map(function(c){ return [c,c]; })),
        function(v){ state.cat=v; lsSet('fa.cat',v); render(); }),
      sel(state.hor, [['all','Kurz- & langfristig'],['short','Nur nächste Wochenenden'],['long','Nur langfristig']],
        function(v){ state.hor=v; lsSet('fa.hor',v); render(); })
    ),
    h('div',{class:'table-wrap thin-scroll'}, h('table',{}, thead, tbody)),
    h('p',{class:'count', text: rows.length+' von '+EVENTS.length+' Events'+(PAST_COUNT?' · '+PAST_COUNT+' vergangene ausgeblendet':'')})
  );
}
function renderTableOnly(){
  var old = document.getElementById('tableview');
  if(!old) return render();
  var nw = tableView();
  old.replaceWith(nw);
  var inp = nw.querySelector('input[type=search]');
  if(inp){ inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

/* ---------- feedback modal ---------- */
function feedbackText(){
  var up=[], down=[];
  EVENTS.concat(DB.events).forEach(function(e){
    var v = state.feedback[e.id];
    if(v===undefined) return;
    var line = e.name+' ('+(e.city||e.location||'')+(e.date? ', '+fmt(e.date):'')+')';
    if(v>0 && up.indexOf(line)<0) up.push(line);
    if(v<0 && down.indexOf(line)<0) down.push(line);
  });
  var t = 'Familien-Feedback fürs Dashboard (Stand '+fmt(TODAY)+'):\n\n';
  t += up.length? 'Gefällt uns:\n- '+up.join('\n- ')+'\n\n' : 'Gefällt uns: –\n\n';
  t += down.length? 'Eher nichts für uns:\n- '+down.join('\n- ')+'\n' : 'Eher nichts für uns: –\n';
  t += '\nBitte in die gelernten Präferenzen der Datenbank übernehmen.';
  return t;
}
function modalView(){
  if(!state.modal) return null;
  var close = function(){ state.modal=null; render(); };
  var content;
  if(state.modal.type==='ics'){
    content = h('div',{class:'modal'},
      h('h3',{text:'Kalender-Datei'}),
      h('p',{text:'Der direkte Download wurde blockiert. Text kopieren und als .ics-Datei speichern.'}),
      h('textarea',{readonly:'readonly'}, state.modal.text),
      h('div',{class:'modal-foot'}, h('button',{class:'btn', text:'Schließen', on:{click:close}})));
  } else {
    var n = Object.keys(state.feedback).length;
    var ta = h('textarea',{readonly:'readonly'}, feedbackText());
    var list = h('div',{class:'fb-list'});
    DB.events.forEach(function(e){
      var v = state.feedback[e.id];
      if(v===undefined) return;
      list.appendChild(h('div',{class:'fb-item'},
        h('span',{text:(v>0?'👍  ':'👎  ')+e.name}),
        h('button',{class:'mini', text:'entfernen', on:{click:function(){ setFb(e.id,0); state.modal={type:'fb'}; render(); }}})));
    });
    content = h('div',{class:'modal'},
      h('h3',{text:'Familien-Feedback'}),
      h('p',{text: n? 'Diese Bewertungen liegen lokal in diesem Browser und sortieren die Vorschläge (👍 nach oben, 👎 ausgeblendet). Zum dauerhaften Lernen den Text kopieren und Claude im Chat schicken.'
                    : 'Noch keine Bewertungen. Mit 👍 / 👎 auf den Karten bewerten – die Sortierung passt sich sofort an.'}),
      n? list : null,
      n? ta : null,
      h('div',{class:'modal-foot'},
        h('button',{class:'mini', text: state.showHidden? 'Ausgeblendete verbergen':'Ausgeblendete anzeigen',
          on:{click:function(){ state.showHidden=!state.showHidden; lsSet('fa.showHidden',state.showHidden); render(); }}}),
        n? h('button',{class:'btn', text:'Alles zurücksetzen', on:{click:function(){ state.feedback={}; lsSet('fa.feedback',{}); render(); }}}) : null,
        n? h('button',{class:'btn btn-primary', text:'Text kopieren', on:{click:function(ev){
            var txt = feedbackText();
            try{ navigator.clipboard.writeText(txt); }catch(err){ ta.select(); document.execCommand('copy'); }
            ev.target.textContent='Kopiert ✓';
          }}}) : null,
        h('button',{class:'btn', text:'Schließen', on:{click:close}})));
  }
  var ov = h('div',{class:'overlay', on:{click:function(ev){ if(ev.target===ov) close(); }}}, content);
  return ov;
}

/* ---------- shell ---------- */
function themeBtn(){
  var labels = {auto:['Auto',IC.auto], light:['Hell',IC.sun], dark:['Dunkel',IC.moon]};
  var l = labels[state.theme]||labels.auto;
  return h('button',{class:'icon-btn', title:'Farbschema: '+l[0]+' (klicken zum Wechseln)',
    on:{click:function(){
      state.theme = state.theme==='auto'?'light': state.theme==='light'?'dark':'auto';
      lsSet('fa.theme', state.theme);
      document.documentElement.setAttribute('data-theme', state.theme);
      render();
    }}}, h('span',{html:l[1]}), h('span',{text:l[0]}));
}
function render(){
  var root = document.getElementById('root');
  root.textContent = '';
  var olds = document.querySelectorAll('.overlay');
  for(var i=0;i<olds.length;i++) olds[i].remove();
  var nFb = Object.keys(state.feedback).length;
  var stale = META.lastUpdated ? Math.round((TODAY - pd(META.lastUpdated))/864e5) : null;

  var head = h('header',{style:'margin-bottom:28px'},
    h('div',{class:'head-row'},
      h('div',{},
        h('div',{class:'eyebrow', html:IC.sparkle+' <span>Familien-Ausflüge · Ruhrgebiet</span>'}),
        h('h1',{class:'h1 display', text:'Ausflugsplaner'}),
        h('p',{class:'sub', text:'Kuratiert für ein 6-jähriges Kind rund um Mülheim an der Ruhr.'
          + (META.lastUpdated? '  ·  Zuletzt aktualisiert: '+fmt(META.lastUpdated) : '')
          + '  ·  '+EVENTS.length+' Events'})
      ),
      h('div',{class:'head-tools'},
        h('button',{class:'icon-btn', title:'Familien-Feedback', on:{click:function(){ state.modal={type:'fb'}; render(); }}},
          h('span',{html:IC.chat}), h('span',{text: nFb? String(nFb) : 'Feedback'})),
        themeBtn()
      )
    ),
    h('div',{class:'rule'})
  );
  root.appendChild(head);

  if(stale!==null && stale>8){
    root.appendChild(h('div',{class:'banner'}, h('span',{html:IC.alert}),
      h('span',{text:'Datenstand ist '+stale+' Tage alt – der wöchentliche Task lief zuletzt am '+fmt(META.lastUpdated)+'. Termine können veraltet sein.'})));
  }

  if(!EVENTS.length){
    root.appendChild(h('div',{class:'card', style:'text-align:center;font-style:italic',
      text:'Noch keine Daten – wird beim nächsten Lauf des wöchentlichen Tasks befüllt.'}));
  } else {
    var al = ticketAlarm(); if(al) root.appendChild(al);
    var tabs = h('div',{class:'tabs', role:'tablist'});
    [['weekends','Nächste 3 Wochenenden'],['holidays', currentHoliday()? 'Ferienprogramm':'Ferien'],['all','Alle Events']]
      .forEach(function(t){
        tabs.appendChild(h('button',{class:'tab', role:'tab', 'aria-selected': state.tab===t[0]?'true':'false', text:t[1],
          on:{click:function(){ state.tab=t[0]; lsSet('fa.tab',t[0]); render(); }}}));
      });
    root.appendChild(tabs);
    if(state.showHidden) root.appendChild(h('p',{class:'sub-head', text:'Ausgeblendete (👎) Einträge werden gerade mit angezeigt'}));
    root.appendChild(state.tab==='weekends'? weekendView() : state.tab==='holidays'? holidayView() : tableView());
  }

  root.appendChild(h('footer',{}, 'Automatisch gepflegt vom wöchentlichen Task „family-weekend-events-mulheim". '
    + 'Bewertungen und Einstellungen werden nur lokal in diesem Browser gespeichert.'));

  var m = modalView(); if(m) document.body.appendChild(m);
}

render();
window.addEventListener('keydown', function(ev){ if(ev.key==='Escape' && state.modal){ state.modal=null; render(); } });
})();
</script>
</body>
